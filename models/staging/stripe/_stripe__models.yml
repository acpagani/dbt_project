models:
  - name: stg_stripe__payments
    description: "Standarized, normalized and renamed payments data from source"
    columns:
      - name: payment_id
        description: "Unique identifier for a payment"
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__orders')
                field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments: 
                values: ['credit_card', 'bank_transfer', 'coupon', 'gift_card']
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments: 
                values: ['success', 'fail']
      - name: amount
      - name: created_at
      - name: _batched_at