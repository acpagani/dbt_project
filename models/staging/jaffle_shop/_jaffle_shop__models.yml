models:
  - name: stg_jaffle_shop__customers
    description: "Standarized and renamed customers data from source"
    columns:
      - name: customer_id
        description: "Unique identifier for a customer"
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: "Customer's First Name"
      - name: last_name
        description: "Customer's Last Name"

  - name: stg_jaffle_shop__orders
    description: "Standarized and renamed orders data from source"
    columns:
      - name: order_id
        description: "Unique identifier for an order"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Unique identifier for a customer"
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: "Order's date"
      - name: order_status
        description: "Order's Status"
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'returned', 'completed', 'return_pending']
      - name: _etl_loaded_at
        description: "Load Time"
