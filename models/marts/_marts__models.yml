models:
  - name: fct_orders
    columns:
      - name: order_id
        description: "Unique identifier for an order"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Unique identifier for a customer"
        data_tests:
          - not_null
      - name: order_date
      - name: order_status
      - name: amount
  
  - name: dim_customers
    columns:
      - name: customer_id
        description: "Unique identifier for a customer"
        data_tests:
          - not_null
          - unique
      - name: first_name
      - name: last_name
      - name: first_order_date
      - name: most_recent_order_date
      - name: number_of_orders
      - name: lifetime_value